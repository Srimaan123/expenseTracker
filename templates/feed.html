<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    color: #262626;
    font: 14px Arial, sans-serif;
  }

  .feed {
    max-width: 470px;
    margin: 0 auto;
  }

  .post {
    margin-bottom: 20px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
  }

  .post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    font-weight: bold;
  }

  .avatar {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #e8e8e8;
    color: #666;
    font-size: 18px;
  }

  .post-placeholder {
    height: 300px;
    display: grid;
    place-items: center;
    background: #eee;
    color: #888;
    font-size: 48px;
  }

  .post-content { padding: 12px; }
  .actions { display: flex; gap: 16px; margin-bottom: 10px; font-size: 20px; }
  .likes { margin-bottom: 8px; font-weight: bold; }
  .caption { line-height: 1.5; }
  .caption strong { margin-right: 5px; }
</style>

<div class="feed">
  <article class="post">
    <header class="post-header">
      <span class="avatar"><i class="fa-solid fa-user"></i></span>
      <span>alex_morgan</span>
    </header>

    <div class="post-placeholder" aria-label="Post image placeholder">
      <i class="fa-regular fa-image"></i>
    </div>

    <div class="post-content">
      <div class="actions">
        <i class="fa-regular fa-heart" aria-label="Like"></i>
        <i class="fa-regular fa-comment" aria-label="Comment"></i>
        <i class="fa-regular fa-paper-plane" aria-label="Share"></i>
      </div>
      <div class="likes">1,284 likes</div>
      <div class="caption">
        <strong>alex_morgan</strong>
        A little fresh air goes a long way 🌿
      </div>
    </div>
  </article>
</div>
