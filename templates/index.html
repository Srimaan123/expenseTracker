<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(15, 35, 23, 0.42), rgba(15, 35, 23, 0.62)),
        url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2000&q=85")
        center / cover no-repeat fixed;
    }

    .login-card {
      width: min(90vw, 480px);
      padding: 48px;
      border: 1px solid rgba(235, 245, 225, 0.32);
      border-radius: 24px;
      background: rgba(28, 48, 34, 0.62);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    .subtitle {
      margin: 0 0 32px;
      color: rgba(245, 248, 238, 0.8);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 54px;
      padding: 0 15px;
      border: 1px solid rgba(235, 245, 225, 0.35);
      border-radius: 10px;
      outline: none;
      background: rgba(245, 248, 238, 0.12);
      color: #fff;
      font-size: 16px;
    }

    input::placeholder {
      color: rgba(245, 248, 238, 0.65);
    }

    input:focus {
      border-color: #c5d9a6;
      box-shadow: 0 0 0 3px rgba(197, 217, 166, 0.18);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 4px 0 24px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #9eb77b;
    }

    a {
      color: #d5e4bd;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    button {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 10px;
      background: #c5d9a6;
      color: #233626;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #d5e4bd;
    }

    .signup {
      margin: 24px 0 0;
      text-align: center;
      color: rgba(245, 248, 238, 0.82);
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .login-card {
        padding: 34px 26px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account to continue.</p>

    <form action="/" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Enter your username"
          autocomplete="username"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" name="remember" />
          Remember me
        </label>
        <a href="/forgotpassword">Forgot password?</a>
      </div>

      <button type="submit">Log in</button>
    </form>

    <p class="signup">
      Don’t have an account? <a href="/createaccount">Create an account</a>
    </p>
  </main>
</body>
</html>
