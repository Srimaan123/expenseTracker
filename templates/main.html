<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram-style Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #262626;
      background: #fff;
      font-family: "Inter", Arial, sans-serif;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 245px;
      padding: 28px 18px 18px;
      border-right: 1px solid #dbdbdb;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .brand {
      margin: 8px 12px 36px;
      color: inherit;
      text-decoration: none;
      font-family: "Fredoka", sans-serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: -1.5px;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button,
    .profile-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }

    .nav button:hover,
    .nav button.active,
    .profile-link:hover {
      background: #f5f5f5;
    }

    .icon {
      width: 25px;
      font-size: 22px;
      text-align: center;
    }

    .profile-link {
      margin-top: auto;
    }

    .profile-pic {
      width: 28px;
      height: 28px;
      border: 1px solid #dbdbdb;
      border-radius: 50%;
      object-fit: cover;
    }

    main {
      height: 100vh;
      margin-left: 245px;
    }

    #pageFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 700px) {
      .sidebar {
        z-index: 2;
        inset: auto 0 0;
        width: 100%;
        height: 56px;
        padding: 4px 10px;
        border-top: 1px solid #dbdbdb;
        border-right: 0;
        flex-direction: row;
      }

      .brand,
      .nav button span:last-child,
      .profile-link span {
        display: none;
      }

      .nav {
        width: 100%;
        display: flex;
        justify-content: space-around;
      }

      .nav button,
      .profile-link {
        padding: 8px;
      }

      .profile-link {
        margin: 0;
      }

      main {
        height: calc(100vh - 56px);
        margin: 0 0 56px;
      }
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <a class="brand" href="#" data-page="/home/{{username}}">Instagram</a>

    <nav class="nav" aria-label="Main navigation">
      <button class="active" type="button" data-page="/home/{{username}}">
        <span class="icon">⌂</span><span>Home</span>
      </button>
      <button type="button" data-page="/search/{{username}}">
        <span class="icon">⌕</span><span>Search</span>
      </button>
      <button type="button" data-page="/explore/{{username}}">
        <span class="icon">▧</span><span>Explore</span>
      </button>
      <button type="button" data-page="/reels/{{username}}">
        <span class="icon">▶</span><span>Reels</span>
      </button>
      <button type="button" data-page="/messages/{{username}}">
        <span class="icon">✉</span><span>Messages</span>
      </button>
      <button type="button" data-page="/notifications/{{username}}">
        <span class="icon">♡</span><span>Notifications</span>
      </button>
      <button type="button" data-page="/create/{{username}}">
        <span class="icon">⊕</span><span>Create</span>
      </button>
    </nav>

    <button class="profile-link" type="button" data-page="/profile/{{username}}">
      <img
        class="profile-pic"
        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop"
        alt=""
      />
      <span>Profile</span>
    </button>
  </aside>

  <main>
    <iframe
      id="pageFrame"
      title="Page content"
      src="/home/{{username}}"
    ></iframe>
  </main>

  <script>
    const frame = document.getElementById("pageFrame");
    const pageControls = document.querySelectorAll("[data-page]");
    const navButtons = document.querySelectorAll(".nav button");

    pageControls.forEach((control) => {
      control.addEventListener("click", (event) => {
        event.preventDefault();

        const page = control.dataset.page;
        if (!page) return;

        frame.src = page;

        navButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.page === page);
        });
      });
    });
  </script>
</body>
</html>
