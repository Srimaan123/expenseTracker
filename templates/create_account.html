<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #352b39;
      background:
        linear-gradient(180deg, rgba(46, 35, 73, 0.14), rgba(255, 133, 91, 0.2)),
        url("https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=2000&q=85")
        center / cover no-repeat;
    }

    .signup-card {
      width: min(100%, 420px);
      padding: 38px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 20px 60px rgba(52, 32, 58, 0.25);
      backdrop-filter: blur(12px);
    }

    .sun-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcf70, #ff8b68);
      font-size: 27px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 30px;
    }

    .intro {
      margin-bottom: 26px;
      color: #756b78;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ded6df;
      border-radius: 11px;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #f28b69;
      box-shadow: 0 0 0 3px rgba(242, 139, 105, 0.18);
    }

    button {
      width: 100%;
      margin-top: 7px;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(100deg, #f28b69, #e96b78);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 20px rgba(233, 107, 120, 0.3);
    }

    .login-link {
      margin-top: 20px;
      text-align: center;
      color: #756b78;
      font-size: 14px;
    }

    .login-link a {
      color: #d95f70;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .signup-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="signup-card">
    <div class="sun-icon" aria-hidden="true">☀</div>
    <h1>Create your account</h1>
    <p class="intro">A fresh start begins here. Sign up to get going.</p>

    <form action="#" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Choose a username"
          autocomplete="username"
          required
        />
      </div>

      <div class="field">
        <label for="mobile">Mobile number</label>
        <input
          type="tel"
          id="mobile"
          name="mobile"
          placeholder="Enter your mobile number"
          autocomplete="tel"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          autocomplete="new-password"
          required
        />
      </div>

      <button type="submit">Create Account</button>
    </form>

    <p class="login-link">
      Already have an account? <a href="#">Log in</a>
    </p>
  </main>
</body>
</html>
